name: Update CPI data & deploy

on:
  schedule:
    # 14:20 UTC daily = 09:20 ET in summer, 10:20 ET in winter — comfortably past
    # the 08:30 ET CPI release either way. Deliberately off the hour: jobs scheduled
    # at :00 queue behind everyone else's and get delayed.
    #
    # Daily rather than "around release day" because BLS release dates move, revisions
    # land off-cycle, and seasonal factors get recomputed each January. A run that
    # finds nothing new writes byte-identical files and makes no commit.
    - cron: '20 14 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # committing refreshed data
  pages: write
  id-token: write

# Never let two deployments race; let a running one finish rather than cancelling it
# mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the fetch script is plain Node.
      - name: Fetch latest CPI data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # Optional. Unset -> the script falls back to the keyless BLS v1 API.
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        # --strict: fail rather than commit a build that lost a series (e.g. an
        # expired key silently dropping the sticky lines and recession bands).
        run: node scripts/fetch-data.mjs --fresh --strict

      - name: Commit if the numbers changed
        run: |
          if git diff --quiet -- data/cpi.json public/data.js; then
            echo "No change — BLS published nothing new since the last run."
            exit 0
          fi
          latest=$(node -p "require('./data/cpi.json').latestMonth")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cpi.json public/data.js
          git commit -m "data: refresh through ${latest}"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
